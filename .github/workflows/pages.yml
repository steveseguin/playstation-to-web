name: Deploy arcade to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser test tools
        run: npm ci --ignore-scripts
      - name: Cache open PS1 toolchain
        uses: actions/cache@v4
        with:
          path: .toolchain/arcade
          key: psn00bsdk-linux-v0.24-5ada7c94
      - name: Build original homebrew demos
        run: bash scripts/build-demos.sh
      - name: Package the arcade
        run: npm run build
      - name: Validate catalog and published files
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test game playback and interface
        run: npm run test:browser
      - name: Preserve browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: test-results/
          retention-days: 3
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish arcade
        id: deployment
        uses: actions/deploy-pages@v4
